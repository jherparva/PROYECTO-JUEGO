; Godot 4.3 — Presets de Exportación del Proyecto RTS
; Generado automáticamente para soporte Cross-play PC ↔ Android.
;
; ─── INSTRUCCIONES PARA ACTIVAR EN GODOT EDITOR ────────────────────────────────
; 1. Ve a Project → Export → Add → Android.
; 2. En "Renderer" elige: "Mobile" (Vulkan Mobile). ← OBLIGATORIO para móvil.
; 3. Aplica los parámetros de esta sección en los campos de la UI del Editor.
; 4. Firma el APK con tu keystore (.jks) para publicar en Google Play.

[preset.0]

name="Android — Cross-Play (Wi-Fi LAN)"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"

[preset.0.options]

; ── Renderer ────────────────────────────────────────────────────────────────────
; Usa Vulkan Mobile (NO Compatibility/GLES3) para mejor rendimiento en móvil.
rendering/renderer/rendering_method="mobile"
rendering/renderer/rendering_method.mobile="mobile"

; ── Compresión de Texturas ──────────────────────────────────────────────────────
; ASTC es el estándar moderno para ARM Mali, Adreno y Apple A-series.
; Habilitar también ETC2 como fallback para dispositivos más antiguos.
texture_format/astc_4x4=true
texture_format/astc_8x8=false
texture_format/etc2=true
texture_format/etc=false
texture_format/bptc=false
texture_format/s3tc=false

; ── Permisos de Red (REQUERIDOS para multijugador LAN / Wi-Fi) ────────────────
; INTERNET → Conexiones TCP/UDP para partidas multijugador (ENetMultiplayerPeer).
; ACCESS_NETWORK_STATE → Detectar tipo de red (Wi-Fi/datos móviles).
; CHANGE_WIFI_STATE → Necesario en algunos dispositivos para iniciar servidor LAN.
permissions/internet=true
permissions/access_network_state=true
permissions/change_wifi_state=true
permissions/access_wifi_state=true

; ── Información de la Aplicación ────────────────────────────────────────────────
package/unique_name="com.parra24.rtsempireearth3d"
package/name="RTS Empire Earth 3D"
package/signed=false
version/code=1
version/name="1.0.0"

; ── Arquitecturas ARM ───────────────────────────────────────────────────────────
; arm64-v8a cubre el 95% de dispositivos Android modernos (2018+).
; armeabi-v7a es fallback para dispositivos ARM 32-bit legados.
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false

; ── Tamaño Mínimo y Objetivo de API ────────────────────────────────────────────
; minSdk 28 (Android 9) garantiza Vulkan 1.1.
; targetSdk 34 es el requisito de Google Play para 2024.
package/min_sdk=28
package/target_sdk=34

; ── Orientación de Pantalla ────────────────────────────────────────────────────
screen/orientation=0  ; 0 = Landscape (horizontal), recomendado para RTS.

; ── Exportación de Recursos ────────────────────────────────────────────────────
; Incluir los shaders compilados para Vulkan Mobile.
export/include_debug_symbols=false
binary_format/embed_pck=true
